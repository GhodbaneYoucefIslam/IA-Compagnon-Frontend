services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      args:
        OLLAMA_BASE_URL: '/ollama'
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
      - 'AIRTABLE_SYNC_ENABLED=${AIRTABLE_SYNC_ENABLED-false}'
      - 'AIRTABLE_API_TOKEN=${AIRTABLE_API_TOKEN-}'
      - 'AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID-}'
      - 'AIRTABLE_TABLE_ID=${AIRTABLE_TABLE_ID-}'
      - 'AIRTABLE_VIEW=${AIRTABLE_VIEW-}'
      - 'AIRTABLE_SYNC_INTERVAL_SECONDS=${AIRTABLE_SYNC_INTERVAL_SECONDS-3600}'
      - 'AIRTABLE_REQUEST_TIMEOUT_SECONDS=${AIRTABLE_REQUEST_TIMEOUT_SECONDS-30}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}
